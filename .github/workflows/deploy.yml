name: Deploy to TrueHost

on:
  push:
    branches: [ main ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Create api env file
        run: |
          mkdir -p dist/api
          cat > dist/api/.env << 'EOF'
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          RESEND_FROM=W3 Eco Friendly <noreply@w3eco-friendly.com>
          RESEND_TO=w3@w3eco-friendly.com
          EOF
          echo "api/.env created for deploy"

      - name: Deploy to TrueHost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./